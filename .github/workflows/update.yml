name: Update Free Nodes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch sources
        run: |
          python fetch_sources.py

      - name: Show result
        run: |
          echo "================================"
          echo "NODE RESULT"
          echo "================================"

          if [ -f output/nodes_raw.txt ]; then
            echo "File exists"
            echo "Node count:"
            wc -l output/nodes_raw.txt
            echo ""
            echo "First 10 nodes:"
            head -10 output/nodes_raw.txt
          else
            echo "ERROR: output/nodes_raw.txt not found"
            exit 1
          fi

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/nodes_raw.txt

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update raw nodes"
            git push
          fi
