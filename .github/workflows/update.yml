name: Update Free Nodes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install sing-box
        run: |
          echo "================================"
          echo "INSTALL SING-BOX"
          echo "================================"

          curl -fsSL https://sing-box.app/install.sh | sh

          echo ""
          echo "================================"
          echo "SING-BOX VERSION"
          echo "================================"

          sing-box version

      - name: Fetch sources
        run: |
          python fetch_sources.py

      - name: Prepare test nodes
        run: |
          python prepare_nodes.py

      - name: Test nodes
        run: |
          python test_nodes.py

      - name: Test SS with sing-box
        run: |
          python test_ss_singbox.py

      - name: Show result
        run: |
          echo "================================"
          echo "SS TEST RESULT"
          echo "================================"

          if [ -f output/ss_alive.txt ]; then
            echo "SS result file exists"
            echo "SS nodes:"
            wc -l output/ss_alive.txt
            echo ""
            echo "First 10:"
            head -10 output/ss_alive.txt
          else
            echo "SS result file was not generated"
          fi
