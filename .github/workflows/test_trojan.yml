name: Test Trojan Node


on:

  workflow_dispatch:



jobs:


  test-trojan:


    runs-on: ubuntu-latest



    steps:


      # ==========================
      # 拉取代码
      # ==========================

      - name: Checkout

        uses: actions/checkout@v4



      # ==========================
      # Python环境
      # ==========================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"



      # ==========================
      # 安装Python依赖
      # ==========================

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install requests pysocks



      # ==========================
      # 安装兼容版Xray
      # ==========================

      - name: Install Xray

        run: |

          echo "Download Xray compatible version"

          wget -q https://github.com/XTLS/Xray-core/releases/download/v25.12.8/Xray-linux-64.zip


          unzip -q Xray-linux-64.zip


          chmod +x xray


          echo "========== XRAY VERSION =========="

          ./xray version



      # ==========================
      # 测试Trojan节点
      # ==========================

      - name: Run Trojan test

        run: |

          python test_node.py



      # ==========================
      # 输出调试文件
      # ==========================

      - name: Debug Xray

        if: always()

        run: |


          echo "========== XRAY LOG =========="

          if [ -f xray.log ]; then

            cat xray.log

          else

            echo "xray.log not found"

          fi



          echo "========== XRAY ERROR =========="

          if [ -f xray_error.log ]; then

            cat xray_error.log

          else

            echo "xray_error.log not found"

          fi



          echo "========== XRAY CONFIG =========="

          if [ -f xray_test.json ]; then

            cat xray_test.json

          else

            echo "xray_test.json not found"

          fi



      # ==========================
      # 查看目录
      # ==========================

      - name: Show files

        if: always()

        run: |

          echo "========== FILES =========="

          ls -la
